<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Spider 的漫画日记</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh; display: flex; flex-direction: column;
      font-family: "Microsoft YaHei", "Comic Sans MS", sans-serif; background: #f3e9d7;
    }
    #header {
      padding: 14px 18px; background: #2c2c3e; color: #ffd23f;
      font-size: 18px; font-weight: bold; letter-spacing: 1px;
    }
    #layout { flex: 1; display: flex; min-height: 0; }
    #sidebar {
      width: 150px; background: #e9dcc4; border-right: 2px solid #c9b893;
      overflow-y: auto; padding: 10px;
    }
    #sidebar .date {
      display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px;
      background: #fff; border: 2px solid #333; border-radius: 10px; cursor: pointer;
      font-weight: bold; font-size: 13px; box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    }
    #sidebar .date.active { background: #ffe28a; }
    #page { flex: 1; overflow-y: auto; padding: 24px; }
    #panel {
      background: #fff; border: 3px solid #1a1a1a; border-radius: 16px; padding: 22px 24px;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.18);
      background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 9px 9px;
      animation: flip 0.35s ease;
    }
    #panel .title { font-size: 22px; font-weight: bold; color: #1a1a1a; margin-bottom: 10px; }
    #panel .meta { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    #panel .badge {
      background: #ffe28a; border: 2px solid #1a1a1a; border-radius: 999px;
      padding: 4px 12px; font-size: 13px; font-weight: bold;
    }
    #panel .body { font-size: 16px; line-height: 1.9; color: #2a2a2a; white-space: pre-wrap; font-weight: 600; }
    #empty { color: #999; font-size: 15px; text-align: center; margin-top: 60px; }
    @keyframes flip {
      0% { transform: rotateY(60deg); opacity: 0; }
      100% { transform: rotateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="header">🐱 Spider 的漫画日记</div>
  <div id="layout">
    <div id="sidebar"></div>
    <div id="page"><div id="empty">（还没有日记，明天就有了喵～）</div></div>
  </div>

  <script>
    var sidebar = document.getElementById('sidebar');
    var page = document.getElementById('page');

    async function loadList() {
      var dates = await window.spider.listDiary();
      sidebar.innerHTML = '';
      if (!dates || !dates.length) return;
      dates.forEach(function (d) {
        var b = document.createElement('button');
        b.className = 'date';
        b.textContent = d;
        b.addEventListener('click', function () { loadEntry(d, b); });
        sidebar.appendChild(b);
      });
      loadEntry(dates[0], sidebar.querySelector('.date'));
    }

    function loadEntry(date, btn) {
      document.querySelectorAll('#sidebar .date').forEach(function (x) { x.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      window.spider.readDiary(date).then(function (md) { render(md, date); });
    }

    function render(md, date) {
      var lines = (md || '').split('\n');
      var meta = [], body = [];
      lines.forEach(function (line) {
        if (line.startsWith('> ')) meta.push(line.slice(2));
        else if (line.startsWith('# ')) {}
        else if (line.trim()) body.push(line);
      });

      page.innerHTML = '';
      var panel = document.createElement('div');
      panel.id = 'panel';

      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = '📅 ' + date;
      panel.appendChild(title);

      var metaRow = document.createElement('div');
      metaRow.className = 'meta';
      meta.forEach(function (m) {
        var b = document.createElement('span');
        b.className = 'badge';
        b.textContent = m;
        metaRow.appendChild(b);
      });
      panel.appendChild(metaRow);

      var bodyEl = document.createElement('div');
      bodyEl.className = 'body';
      bodyEl.textContent = body.join('\n');
      panel.appendChild(bodyEl);

      page.appendChild(panel);
    }

    loadList();
  </script>
</body>
</html>
