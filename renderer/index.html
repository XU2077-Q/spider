<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Spider</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent; overflow: hidden; user-select: none;
      cursor: default;
    }
    .pet {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
    }
    /* —— 漫画对白气泡 —— */
    #bubble {
      display: none;
      position: relative;
      max-width: 232px;
      background: #ffffff;
      border: 3px solid #1a1a1a;
      border-radius: 18px;
      padding: 12px 16px;
      font-family: "Microsoft YaHei", "Comic Sans MS", sans-serif;
      font-size: 15px; font-weight: 700;
      color: #1a1a1a; line-height: 1.5;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.18);
      margin-bottom: 4px;
      background-image: radial-gradient(rgba(0,0,0,0.035) 1px, transparent 1px);
      background-size: 8px 8px;
    }
    #bubble.show { display: block; animation: pop 0.28s ease; }
    /* 气泡尾巴（黑描边 + 白填充） */
    #bubble::after {
      content: ''; position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%);
      border: 9px solid transparent; border-top-color: #1a1a1a;
    }
    #bubble::before {
      content: ''; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%);
      border: 7px solid transparent; border-top-color: #ffffff; z-index: 1;
    }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    /* —— 猫 —— */
    #catStage {
      width: 256px; height: 192px; flex: 0 0 192px;
      display: flex; align-items: flex-end; justify-content: center;
    }
    #catMirror { width: 256px; height: 192px; transform-origin: center; }
    #catMirror.flip { transform: scaleX(-1); }
    #cat {
      width: 256px; height: 192px;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    }
  </style>
</head>
<body>
  <div class="pet" id="petWrap">
    <div id="bubble"></div>
    <div id="catStage">
      <div id="catMirror"><div id="cat" role="img" aria-label="Spider"></div></div>
    </div>
  </div>

  <script src="../assets/cat/animations.js"></script>
  <script>
    (function () {
      var bubble = document.getElementById('bubble');
      var petWrap = document.getElementById('petWrap');
      var catMirror = document.getElementById('catMirror');
      var cat = document.getElementById('cat');
      var config = window.CAT_ANIMATIONS;
      var CAT_SCALE = 1;
      var currentType = 'idle';
      var currentClip = 'idle';
      var currentGaze = 'center';
      var frameStarted = performance.now();
      var shownFrame = -1;
      var spriteImages = {};
      var hitCanvas = document.createElement('canvas');
      hitCanvas.width = hitCanvas.height = 1;
      var hitContext = hitCanvas.getContext('2d', { willReadFrequently: true });

      function spriteFor(name) {
        var sheet = config.clips[name].sheet || name;
        if (!spriteImages[sheet]) {
          spriteImages[sheet] = new Image();
          spriteImages[sheet].src = '../assets/cat/' + sheet + '.png';
        }
        return spriteImages[sheet];
      }

      // 只让猫咪当前帧的实际像素响应抓取，透明区域和窗口空白不响应。
      function isOpaqueCatPixel(e) {
        var image = spriteFor(currentClip);
        if (!image.complete || !image.naturalWidth || shownFrame < 0) return false;
        var rect = cat.getBoundingClientRect();
        var x = Math.floor((e.clientX - rect.left) * config.frameWidth / rect.width);
        var y = Math.floor((e.clientY - rect.top) * config.frameHeight / rect.height);
        if (x < 0 || y < 0 || x >= config.frameWidth || y >= config.frameHeight) return false;
        if (catMirror.classList.contains('flip')) x = config.frameWidth - 1 - x;
        try {
          hitContext.clearRect(0, 0, 1, 1);
          hitContext.drawImage(image,
            shownFrame * config.frameWidth + x, y, 1, 1, 0, 0, 1, 1);
          return hitContext.getImageData(0, 0, 1, 1).data[3] >= 32;
        } catch (error) {
          return false;
        }
      }

      // ---- 说话气泡：显示 + 自动隐藏 ----
      var speakTimer = null;
      function speak(text) {
        if (!text) return;
        bubble.textContent = text;
        bubble.classList.remove('show');
        void bubble.offsetWidth; // 重触发动画
        bubble.classList.add('show');
        clearTimeout(speakTimer);
        speakTimer = setTimeout(function () { bubble.classList.remove('show'); }, 6000);
      }
      window.spider && window.spider.onSpeak(speak);

      // ---- 精灵图播放：所有动作共享固定画布与脚底锚点 ----
      function clipFor(type) {
        var followsMouse = type === 'idle' || type === 'emotion-neutral';
        if (followsMouse && currentGaze !== 'center') return 'idle-' + currentGaze;
        return type;
      }

      function selectClip(name, preservePhase) {
        if (!config.clips[name]) name = 'idle';
        var now = performance.now();
        var phase = 0;
        if (preservePhase && config.clips[currentClip]) {
          var previous = config.clips[currentClip];
          phase = ((now - frameStarted) * previous.fps / 1000) % previous.frames;
        }
        currentClip = name;
        var clip = config.clips[name];
        frameStarted = now - phase * 1000 / clip.fps;
        shownFrame = -1;
        cat.style.backgroundImage = 'url("' + spriteFor(name).src + '")';
        cat.style.backgroundSize = (clip.frames * config.frameWidth * CAT_SCALE) + 'px '
          + (config.frameHeight * CAT_SCALE) + 'px';
      }

      function setAnimation(type) {
        if (type === 'walk-left' || type === 'walk-right') {
          catMirror.classList.toggle('flip', type === 'walk-right');
          type = 'walk';
        } else {
          catMirror.classList.remove('flip');
        }
        if (!config.clips[type]) type = 'idle';
        var changed = currentType !== type;
        currentType = type;
        var nextClip = clipFor(type);
        if (nextClip !== currentClip) selectClip(nextClip, !changed && config.clips[currentClip].gaze);
        else if (!changed && !config.clips[currentClip].loop) selectClip(nextClip, false);
        else if (changed) selectClip(nextClip, false);
      }

      function drawFrame() {
        var clip = config.clips[currentClip];
        var position = (performance.now() - frameStarted) * clip.fps / 1000;
        var frame = clip.loop
          ? Math.floor(position) % clip.frames
          : Math.min(clip.frames - 1, Math.max(0, Math.floor(position)));
        if (frame !== shownFrame) {
          shownFrame = frame;
          cat.style.backgroundPosition = (-frame * config.frameWidth * CAT_SCALE) + 'px 0px';
        }
        requestAnimationFrame(drawFrame);
      }

      Object.keys(config.clips).filter(function (name) {
        return name === 'idle' || name.indexOf('idle-') === 0;
      }).concat([
        'struggle', 'stretch', 'beg', 'attention', 'yawn', 'remind-meal',
      ]).forEach(spriteFor);
      selectClip('idle', false);
      requestAnimationFrame(drawFrame);
      window.spider && window.spider.onAnim(setAnimation);
      window.spider && window.spider.onGaze(function (direction) {
        var clip = direction === 'center' ? config.clips.idle : config.clips['idle-' + direction];
        if (!clip || !clip.gaze) return;
        var changed = currentGaze !== direction;
        currentGaze = direction;
        if (changed && (currentType === 'idle' || currentType === 'emotion-neutral')) {
          var nextClip = clipFor(currentType);
          if (nextClip !== currentClip) selectClip(nextClip, true);
        }
      });

      // ---- 拖拽 + 点击识别：覆盖取消、丢失捕获和窗口失焦 ----
      var dragging = false, pointerId = null, downX = 0, downY = 0, moved = false;
      function finishDrag(cancelled) {
        if (!dragging) return;
        var finishedPointer = pointerId;
        dragging = false;
        pointerId = null;
        if (finishedPointer !== null && petWrap.hasPointerCapture(finishedPointer)) {
          petWrap.releasePointerCapture(finishedPointer);
        }
        window.spider && window.spider.dragEnd();
        cat.style.cursor = 'default';
        if (!moved && !cancelled) window.spider && window.spider.openChat();
      }
      document.addEventListener('pointerdown', function (e) {
        if (e.button !== 0 || dragging || e.target !== cat || !isOpaqueCatPixel(e)) return;
        dragging = true;
        pointerId = e.pointerId;
        downX = e.screenX;
        downY = e.screenY;
        moved = false;
        petWrap.setPointerCapture(e.pointerId);
        cat.style.cursor = 'grabbing';
        window.spider && window.spider.dragStart();
        e.preventDefault();
      });
      document.addEventListener('pointermove', function (e) {
        if (!dragging) {
          // 透明空白保持普通箭头，只有猫身实际像素显示可抓取光标。
          cat.style.cursor = e.target === cat && isOpaqueCatPixel(e) ? 'grab' : 'default';
          return;
        }
        if (e.pointerId !== pointerId) return;
        if (Math.abs(e.screenX - downX) > 4 || Math.abs(e.screenY - downY) > 4) moved = true;
        window.spider && window.spider.dragMove();
      });
      document.addEventListener('pointerup', function (e) {
        if (dragging && e.pointerId === pointerId) finishDrag(false);
      });
      document.addEventListener('pointercancel', function (e) {
        if (dragging && e.pointerId === pointerId) finishDrag(true);
      });
      document.addEventListener('lostpointercapture', function (e) {
        if (dragging && e.pointerId === pointerId) finishDrag(true);
      }, true);
      document.addEventListener('pointerleave', function () {
        if (!dragging) cat.style.cursor = 'default';
      });
      window.addEventListener('blur', function () { finishDrag(true); });
    })();
  </script>
</body>
</html>
